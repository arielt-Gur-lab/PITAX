name: R source preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse:
    name: Parse R application and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install ZIP package for end-to-end FASTA export
        run: Rscript -e 'install.packages("zip")'
      - name: Parse all R sources
        run: Rscript tests/preflight/parse_all_r_sources.R
      - name: Exercise FASTA and empty-table exports with 18 records
        run: Rscript tests/preflight/export_writer_base_smoke.R
