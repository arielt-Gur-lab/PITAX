name: R source preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse:
    name: Parse R application and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse all R sources
        run: Rscript tests/preflight/parse_all_r_sources.R
