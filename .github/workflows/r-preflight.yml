name: R source preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse:
    name: Parse R application and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install ZIP package for end-to-end FASTA export
        run: Rscript -e 'install.packages(c("zip", "jsonlite"))'
      - name: Parse all R sources
        run: Rscript tests/preflight/parse_all_r_sources.R
      - name: Exercise N-call evidence and compact BLAST status
        run: |
          Rscript tests/unit/n_call_evidence_smoke.R
          Rscript tests/unit/blast_batch_summary_smoke.R
          Rscript tests/unit/qc_n_trim_window_smoke.R
      - name: Re-trim saved projects without re-uploading AB1
        run: Rscript tests/unit/saved_project_retrim_smoke.R
      - name: Full IUPAC guided manual review (M/V) and lightweight plot
        run: Rscript tests/unit/iupac_guided_review_smoke.R
      - name: 50-read incremental consensus after single-base edit
        run: Rscript tests/unit/incremental_consensus_smoke.R
      - name: Opt-in performance diagnostics and browser timing contract
        run: Rscript tests/unit/performance_probe_smoke.R
      - name: Guided local chromatogram Focus / Full Y-scale
        run: Rscript tests/unit/guided_focus_yscale_smoke.R
      - name: Verify compact guided review with optional detailed evidence
        run: Rscript tests/contracts/peak_review_compact_modal_contract_smoke.R
      - name: Validate repeatable guided peak review row clicks
        run: Rscript tests/contracts/peak_review_reopen_contract_smoke.R
      - name: Exercise FASTA and empty-table exports with 18 records
        run: Rscript tests/preflight/export_writer_base_smoke.R
      - name: Structured header profile model smoke
        run: Rscript tests/unit/header_profile_model_smoke.R
      - name: Header serializer / Sequence Library contract smoke
        run: Rscript tests/unit/header_parser_compat_smoke.R

  browser-download:
    name: Verify real Shiny ZIP download in Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Shiny, DT and zip
        run: Rscript -e 'install.packages(c("shiny", "DT", "zip"))'
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox
      - name: Test native Shiny ZIP download through Chromium
        shell: bash
        run: |
          set -euo pipefail
          Rscript tests/e2e/shiny_prepared_download.R >/tmp/pitax-shiny-e2e.log 2>&1 &
          SHINY_PID=$!
          trap 'cat /tmp/pitax-shiny-e2e.log; kill $SHINY_PID 2>/dev/null || true' EXIT
          STARTED=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:47777 >/dev/null 2>&1; then
              STARTED=1
              break
            fi
            sleep 1
          done
          if [ "$STARTED" -ne 1 ]; then
            echo "Shiny browser test server failed to start"
            exit 1
          fi
          node tests/e2e/zip_download_browser.cjs
          PITAX_BROWSER=firefox node tests/e2e/zip_download_browser.cjs
          Rscript tests/e2e/shiny_header_field_lifecycle.R >/tmp/pitax-header-e2e.log 2>&1 &
          META_PID=$!
          trap 'cat /tmp/pitax-shiny-e2e.log /tmp/pitax-header-e2e.log; kill $SHINY_PID $META_PID 2>/dev/null || true' EXIT
          META_STARTED=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:47778 >/dev/null 2>&1; then
              META_STARTED=1
              break
            fi
            sleep 1
          done
          if [ "$META_STARTED" -ne 1 ]; then
            echo "Shiny metadata editor browser test server failed to start"
            exit 1
          fi
          node tests/e2e/header_field_lifecycle_browser.cjs
